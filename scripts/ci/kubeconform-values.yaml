# Values overlay for the kubeconform tier.
#
# Its job is to force every off-by-default feature ON so the rendered manifests
# actually contain the templates the gate is supposed to check. With default
# values the CRD kinds (ServiceMonitor / PrometheusRule / HTTPRoute) and a dozen
# core-kind templates never render at all, so the schema gate would validate
# nothing for them.
#
# Lives OUTSIDE charts/ on purpose: it is not a `ci/*-values.yaml` scenario, so
# `ct install` never installs it and kind needs no CRDs. It ships to nobody.
#
# Applied to every chart. Charts that don't define these keys ignore them
# (no chart in this repo sets `additionalProperties: false`), so one file covers
# the whole fleet.
#
# This file holds only keys whose NAME AND SHAPE are the same fleet-wide. Anything
# chart-specific lives in `charts/<chart>/ci/kubeconform-overlay.yaml`, applied on
# top when present — v-rising's nested persistence/service and its empty probes,
# nut-exporter's webconfig_file and extraRunFlags, exportarr's whole nested
# subtree. Keeping those out of here is what lets this file stay readable, and it
# stops a shape that suits one chart from being forced on the other eight.
#
# `kubeconform.sh` enforces coverage: it fails when a chart declares a passthrough
# (a key defaulting to `{}` or `[]`) that neither file populates. That check is
# what makes an unset key an error rather than a silent hole — do not work around
# it by deleting a payload.
#
# Two rules for anything added here, both learned the hard way:
#
#   1. Payloads must be REAL, not bare toggles. The PrometheusRule templates
#      wrap their body in `{{- with ...rules }}` under a bare `spec:`, so an
#      empty list renders `spec: null` and fails validation. Same for HTTPRoute
#      parentRefs.
#
#   2. Give every list and map at least TWO entries. Passthrough fields render
#      via `toYaml | nindent N` inside conditionals — leaving them empty takes
#      the `{{- else }}` branch and never exercises the indentation logic, which
#      is where `range`/`nindent` bugs actually live. Same reasoning as Apache
#      Pulsar's `.ci/templates-all-values.yaml`.
#
#   3. Match the key's SHAPE per chart, not just its name. `extraEnv` is a map in
#      all nine charts but `extraEnvFrom` is a list. Where the shape itself
#      diverges — `persistence` flat here but nested under `steamServer`/`world`
#      in v-rising — the divergent spelling belongs in that chart's own file, not
#      alongside the flat one here.
#
# Rule 2 trades rather than adds where the two branches are mutually exclusive:
# filling `httproute.rules` renders the `toYaml | nindent` branch *instead of*
# the default-backendRefs `{{- else }}` fallback, and pass 1 has httproute off,
# so that fallback is now schema-validated nowhere. Accepted: all 5 charts
# shipping the template cover it in `tests/httproute_test.yaml` ("generates a
# default backendRef rule..."). Coverage here is per-template, not per-branch —
# Pulsar's second `-patch1.yaml` overlay is what closes that, and it is not
# worth a second render pass while the unit-test tier holds.
#
# New off-by-default feature ⇒ add its toggle here, or the gate never sees it.

# Pod-level passthroughs. Every one of these renders through `toYaml | nindent`
# inside a conditional, so an empty default takes the `{{- else }}` branch and the
# indentation logic is never executed. This is the exact blind spot that let the
# six #172 defects ship green through both render passes.
podAnnotations:
  kubeconform.example.org/first: "1"
  kubeconform.example.org/second: "2"

podLabels:
  kubeconform-first: "1"
  kubeconform-second: "2"

nodeSelector:
  kubernetes.io/os: linux
  kubeconform.example.org/pool: validation

tolerations:
  - key: kubeconform.example.org/first
    operator: Exists
    effect: NoSchedule
  - key: kubeconform.example.org/second
    operator: Exists
    effect: NoExecute

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values: [linux]
            - key: kubernetes.io/arch
              operator: In
              values: [amd64, arm64]

imagePullSecrets:
  - name: kubeconform-registry-first
  - name: kubeconform-registry-second

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# A map in all nine charts, unlike extraEnvFrom below.
extraEnv:
  KUBECONFORM_FIRST: "1"
  KUBECONFORM_SECOND: "2"

# A list, and only bookstack-file-exporter and unpoller define it.
extraEnvFrom:
  - configMapRef:
      name: kubeconform-first
  - secretRef:
      name: kubeconform-second

volumes:
  - name: kubeconform-first
    emptyDir: {}
  - name: kubeconform-second
    emptyDir: {}

volumeMounts:
  - name: kubeconform-first
    mountPath: /tmp/kubeconform-first
  - name: kubeconform-second
    mountPath: /tmp/kubeconform-second

# Pod and container security contexts. Empty by default in bookstack, nut-exporter
# and v-rising, non-empty in the other six — where these merge with the chart's own
# values, which is harmless: this tier renders, it never installs.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# PVCs. `enabled` is off by default in bookstack-file-exporter, and `annotations`
# and `selector` were the two fields whose `indent`-vs-`nindent` bugs this overlay
# could not see. `existingClaim` is deliberately NOT set — it suppresses the PVC.
# v-rising's two-PVC nesting lives in its own file.
persistence:
  enabled: true
  annotations:
    kubeconform.example.org/first: "1"
    kubeconform.example.org/second: "2"
  selector:
    matchLabels:
      kubeconform-disk: ssd
    matchExpressions:
      - key: kubeconform-zone
        operator: In
        values: [first, second]

metrics:
  enabled: true
  # Dead in this pass by construction, and kept only as documentation: the
  # templates gate it on `and metrics.enabled (not serviceMonitor.enabled)`, and
  # serviceMonitor is forced on below. Pass 1 covers the branch with each chart's
  # own non-empty default, so the coverage exists — it is just not from here.
  podAnnotations:
    kubeconform.example.org/first: "1"
    kubeconform.example.org/second: "2"
  serviceMonitor:
    enabled: true
    additionalLabels:
      kubeconform-first: "1"
      kubeconform-second: "2"
    targetLabels:
      - kubeconform-first
      - kubeconform-second
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        targetLabel: node
      - sourceLabels: [__meta_kubernetes_namespace]
        targetLabel: ns
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: go_.*
        action: drop
      - sourceLabels: [__name__]
        regex: promhttp_.*
        action: drop
  prometheusRule:
    enabled: true
    labels:
      kubeconform-first: "1"
      kubeconform-second: "2"
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Exporter target is down.
      - alert: TargetFlapping
        expr: changes(up[15m]) > 3
        for: 10m
        labels:
          severity: info
        annotations:
          summary: Exporter target is flapping.

httproute:
  enabled: true
  annotations:
    kubeconform.example.org/first: "1"
    kubeconform.example.org/second: "2"
  # Non-empty so the `{{- if .Values.httproute.rules }}` branch renders instead
  # of the default-backendRef fallback.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: kubeconform-backend
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kubeconform-backend
          port: 9090
  parentRefs:
    - name: kubeconform-gateway
      namespace: default
      sectionName: websecure
    - name: kubeconform-gateway-second
      namespace: default
      sectionName: web
  hostnames:
    - first.kubeconform.example.org
    - second.kubeconform.example.org

# Core kinds that no default render reaches. Uniform key names across the fleet,
# so one block covers every chart that ships the template.
serviceAccount:
  create: true
  automount: true
  annotations:
    kubeconform.example.org/first: "1"
    kubeconform.example.org/second: "2"

ingress:
  enabled: true
  className: kubeconform
  annotations:
    kubeconform.example.org/first: "1"
    kubeconform.example.org/second: "2"
  hosts:
    - host: first.kubeconform.example.org
      paths:
        - path: /
          pathType: Prefix
        - path: /metrics
          pathType: Prefix
    - host: second.kubeconform.example.org
      paths:
        - path: /
          pathType: Prefix
        # No pathType on purpose: the templates render
        # `{{ .pathType | default "Prefix" }}`, and with every entry setting it
        # explicitly that fallback executes in no pass. No chart has an ingress
        # unit test, so this is its only coverage.
        - path: /metrics
  tls:
    - secretName: kubeconform-tls-first
      hosts:
        - first.kubeconform.example.org
    - secretName: kubeconform-tls-second
      hosts:
        - second.kubeconform.example.org

# Every chart's Service takes `type`; v-rising's two nested Services and their
# loadBalancerSourceRanges live in its own file.
service:
  type: LoadBalancer
