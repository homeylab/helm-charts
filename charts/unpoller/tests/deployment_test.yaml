suite: unpoller deployment wiring
templates:
  - templates/deployment.yaml
release:
  name: rel
tests:
  - it: renders the container image as registry/repository:tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/unpoller/unpoller:v3.3.1
  - it: sets serviceAccountName
    set:
      serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: rel-unpoller
  - it: applies hardened pod and container securityContext defaults (UID 65532)
    asserts:
      - equal: { path: "spec.template.spec.securityContext.runAsNonRoot", value: true }
      - equal: { path: "spec.template.spec.securityContext.runAsUser", value: 65532 }
      - equal: { path: "spec.template.spec.securityContext.runAsGroup", value: 65532 }
      - equal: { path: "spec.template.spec.securityContext.fsGroup", value: 65532 }
      - equal: { path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true }
      - contains:
          path: "spec.template.spec.containers[0].securityContext.capabilities.drop"
          content: ALL
  - it: wires envFrom to the chart-managed Secret when unifi auth is set
    set:
      settings.unifi.auth.user: admin
      settings.unifi.auth.pass: s3cret-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: rel-unpoller
  - it: wires envFrom to existingSecret when set, taking precedence over the chart Secret
    set:
      settings.unifi.auth.user: admin
      settings.unifi.auth.pass: s3cret-pass
      existingSecret: my-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-secret
  - it: omits envFrom entirely when no auth, no existingSecret, no extraEnvFrom
    set:
      settings.unifi.auth.user: ""
      settings.unifi.auth.pass: ""
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom
  - it: omits empty influxdb.config env so unpoller does not fail on empty UP_INFLUXDB_INTERVAL
    set:
      settings.influxdb.enabled: true
      settings.influxdb.config.url: http://influx:8086
    asserts:
      # url is set -> rendered; db/interval default empty -> omitted (empty duration would crash unpoller)
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UP_INFLUXDB_URL
            value: http://influx:8086
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: UP_INFLUXDB_INTERVAL
            value: ""
  - it: renders influxdb.config values that are set
    set:
      settings.influxdb.enabled: true
      settings.influxdb.config.interval: 30s
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UP_INFLUXDB_INTERVAL
            value: "30s"
  - it: appends extraEnvFrom after the chart Secret
    set:
      settings.unifi.auth.user: admin
      settings.unifi.auth.pass: s3cret-pass
      extraEnvFrom:
        - secretRef:
            name: unpoller-controller-1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: rel-unpoller
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: unpoller-controller-1
  - it: renders extraEnvFrom even with no chart Secret and no existingSecret
    set:
      settings.unifi.auth.user: ""
      settings.unifi.auth.pass: ""
      extraEnvFrom:
        - configMapRef:
            name: unpoller-extra-config
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: unpoller-extra-config
  - it: wires envFrom to the chart-managed Secret for influxdb-only creds
    set:
      settings.unifi.auth.user: ""
      settings.unifi.auth.pass: ""
      settings.influxdb.enabled: true
      settings.influxdb.auth.user: influx-user
      settings.influxdb.auth.pass: influx-pass
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: rel-unpoller
  - it: never renders UP_UNIFI_CONTROLLER_0_PASS as a plaintext env value
    set:
      settings.unifi.auth.user: admin
      settings.unifi.auth.pass: s3cret-pass
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: UP_UNIFI_CONTROLLER_0_PASS, value: s3cret-pass }
  - it: never renders UP_INFLUXDB_PASS as a plaintext env value
    set:
      settings.influxdb.enabled: true
      settings.influxdb.auth.user: influx-user
      settings.influxdb.auth.pass: influx-pass
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: UP_INFLUXDB_PASS, value: influx-pass }
  - it: still renders non-sensitive unifi config and prometheus env
    set:
      settings.unifi.config.url: https://unifi.local:8443
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: UP_UNIFI_CONTROLLER_0_URL, value: "https://unifi.local:8443" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: UP_PROMETHEUS_NAMESPACE, value: "unpoller" }

  - it: leaves automountServiceAccountToken unset on the pod spec by default
    # the pod spec wins over the ServiceAccount, so writing true here would override
    # an external ServiceAccount that opted out - only the false case is rendered
    asserts:
      # anchor the render so the notExists below cannot pass on an absent document
      - exists: { path: spec.template.spec.serviceAccountName }
      - notExists: { path: spec.template.spec.automountServiceAccountToken }

  - it: honours serviceAccount.automount when pointing at an external ServiceAccount
    set:
      serviceAccount.create: false
      serviceAccount.automount: false
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: default }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  - it: honours serviceAccount.automount on a chart-managed ServiceAccount
    # the gate is on automount alone, so a chart-managed ServiceAccount must opt the
    # pod out too - the SA object's own field does not reach an already-created pod template
    set:
      serviceAccount.create: true
      serviceAccount.automount: false
    asserts:
      - exists: { path: spec.template.spec.serviceAccountName }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  # Optional pod-spec blocks. Static validation cannot see these: a pod spec
  # missing imagePullSecrets is schema-valid, so only a unit test catches a
  # `with` block that stopped rendering. Both directions are pinned - absent
  # when unset, and every entry present when set.
  - it: omits every optional pod-spec block when unset
    asserts:
      - notExists: { path: spec.template.spec.imagePullSecrets }
      - notExists: { path: spec.template.spec.nodeSelector }
      - notExists: { path: spec.template.spec.affinity }
      - notExists: { path: spec.template.spec.tolerations }
      - notExists: { path: spec.template.spec.volumes }
      - notExists: { path: "spec.template.spec.containers[0].volumeMounts" }
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  # updateStrategy is a `with` block with a NON-empty default, so losing it
  # does not omit a feature - it silently flips the workload to RollingUpdate.
  - it: keeps the Recreate update strategy by default
    asserts:
      - equal: { path: spec.strategy.type, value: Recreate }

  # Two entries per list on purpose: one entry cannot catch a range that only
  # ever emits its first item, and two map keys catch a `toYaml` swapped for a
  # single-key interpolation. Lengths are pinned too, so a spurious third entry
  # fails rather than passing on the two that were checked.
  - it: renders every entry of every optional pod-spec block when set
    set:
      imagePullSecrets:
        - name: first-registry
        - name: second-registry
      nodeSelector:
        kubernetes.io/arch: amd64
        topology.kubernetes.io/zone: us-east-1a
      tolerations:
        - key: first-taint
          operator: Exists
          effect: NoSchedule
        - key: second-taint
          operator: Exists
          effect: NoExecute
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                      - windows
      podLabels:
        first-label: one
        second-label: two
      podAnnotations:
        first-annotation: one
        second-annotation: two
      volumes:
        - name: first-extra
          emptyDir: {}
        - name: second-extra
          emptyDir: {}
      volumeMounts:
        - name: first-extra
          mountPath: /first
        - name: second-extra
          mountPath: /second
    asserts:
      - lengthEqual: { path: "spec.template.spec.imagePullSecrets", count: 2 }
      - equal: { path: "spec.template.spec.imagePullSecrets[0].name", value: first-registry }
      - equal: { path: "spec.template.spec.imagePullSecrets[1].name", value: second-registry }
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64
      - equal:
          path: spec.template.spec.nodeSelector["topology.kubernetes.io/zone"]
          value: us-east-1a
      - lengthEqual: { path: "spec.template.spec.tolerations", count: 2 }
      - equal: { path: "spec.template.spec.tolerations[0].key", value: first-taint }
      - equal: { path: "spec.template.spec.tolerations[1].key", value: second-taint }
      - equal:
          path: "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[1]"
          value: windows
      - equal:
          path: spec.template.metadata.labels["first-label"]
          value: one
      - equal:
          path: spec.template.metadata.labels["second-label"]
          value: two
      - equal:
          path: spec.template.metadata.annotations["first-annotation"]
          value: one
      - equal:
          path: spec.template.metadata.annotations["second-annotation"]
          value: two
      - lengthEqual: { path: spec.template.spec.volumes, count: 2 }
      - contains:
          path: spec.template.spec.volumes
          content: { name: first-extra, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: second-extra, emptyDir: {} }
      - lengthEqual: { path: "spec.template.spec.containers[0].volumeMounts", count: 2 }
      - equal: { path: "spec.template.spec.containers[0].volumeMounts[0].mountPath", value: /first }
      - equal: { path: "spec.template.spec.containers[0].volumeMounts[1].mountPath", value: /second }
