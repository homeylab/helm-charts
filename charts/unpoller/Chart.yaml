apiVersion: v2
name: unpoller
description: unpoller for unifi controller metrics
icon: https://unpoller.com/img/logo.png
type: application

home: https://unpoller.com
sources:
  - https://github.com/unpoller/unpoller
  - https://github.com/homeylab/helm-charts
keywords:
  - unpoller
  - unifi
  - ubiquiti
  - prometheus
  - exporter
  - metrics
maintainers:
  - name: homeylab
    url: https://github.com/homeylab

# This is the chart version. SemVer: https://semver.org/
version: 4.3.0

# Application version (upstream image tag). Not SemVer-bound.
# renovate: datasource=docker depName=ghcr.io/unpoller/unpoller
appVersion: "v3.3.1"

# Minimum supported Kubernetes version. The -0 suffix matches managed distros'
# prerelease-style versions (e.g. v1.28.3-gke.x).
kubeVersion: ">=1.19.0-0"

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/homeylab/helm-charts/tree/main/charts/unpoller
  artifacthub.io/changes: |
    - kind: changed
      description: "the pod spec no longer hard-codes automountServiceAccountToken true; it is written only when serviceAccount.automount is false, so an external ServiceAccount's own opt-out is honoured. Effective behaviour is unchanged, but pods roll once"
    - kind: fixed
      description: "the PrometheusRule is now gated on metrics.enabled as well as metrics.prometheusRule.enabled. NOTE: with metrics.enabled false it is REMOVED on upgrade - see the upgrade matrix in the README"
    - kind: fixed
      description: "a PrometheusRule with an empty rules list is no longer rendered - it emitted `spec: null`, which the CRD rejects"
    - kind: added
      description: "unit test coverage for serviceAccount.automount on both the pod spec and the ServiceAccount object"
