suite: bookstack PVC storageClass harmonization
templates:
  - templates/pvc.yaml
release:
  name: rel
tests:
  - it: omits storageClassName when storageClass is unset (uses cluster default)
    set:
      persistence.storageClass: ""
    asserts:
      - notExists:
          path: spec.storageClassName
  - it: sets storageClassName to empty string when storageClass is "-" (disables dynamic provisioning)
    set:
      persistence.storageClass: "-"
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""
  - it: sets storageClassName to the named class
    set:
      persistence.storageClass: nfs-provisioner
    asserts:
      - equal:
          path: spec.storageClassName
          value: nfs-provisioner
  - it: renders a multi-key selector
    # matchLabels + matchExpressions together; the previous `indent` form produced
    # invalid YAML and failed the render outright, so a single-key selector passed
    # while any real one did not
    set:
      persistence.selector:
        matchLabels:
          disk: ssd
        matchExpressions:
          - key: zone
            operator: In
            values: [a, b]
    asserts:
      - equal: { path: spec.selector.matchLabels.disk, value: ssd }
      - equal: { path: "spec.selector.matchExpressions[0].key", value: zone }
