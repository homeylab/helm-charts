suite: deployment wiring
templates:
  - templates/deployment.yaml
release:
  name: rel
tests:
  - it: uses the lscr.io image ref
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^lscr\\.io/linuxserver/bookstack:"
  - it: envFrom targets the chart-managed Secret by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: rel-bookstack
  - it: envFrom targets existingSecret when set
    set:
      existingSecret: my-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-secret
  - it: renders linuxserver PUID/PGID/UMASK/TZ env
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: PUID, value: "1000" } }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: TZ, value: "Etc/UTC" } }
  - it: DB_DATABASE derives from mariadb.auth.database when embedded
    set:
      mariadb.enabled: true
      mariadb.auth.database: bs_db
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DB_DATABASE, value: "bs_db" } }
  - it: external dbHost wires directly into the DB_HOST env (embedded mariadb disabled)
    set:
      mariadb.enabled: false
      config.dbHost: mariadb.example.svc.cluster.local
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DB_HOST, value: "mariadb.example.svc.cluster.local" } }
  - it: DB_HOST falls back to the release-derived mariadb host when config.dbHost is unset
    release:
      name: rel
      namespace: rel-ns
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: DB_HOST, value: "rel-mariadb.rel-ns.svc.cluster.local" } }
  - it: omits linuxserver env when linuxserver.enabled is false
    set:
      linuxserver.enabled: false
    asserts:
      - notContains: { path: "spec.template.spec.containers[0].env", content: { name: PUID, value: "1000" } }
      - notContains: { path: "spec.template.spec.containers[0].env", content: { name: TZ, value: "Etc/UTC" } }

  - it: leaves automountServiceAccountToken unset on the pod spec by default
    # the pod spec wins over the ServiceAccount, so writing true here would override
    # an external ServiceAccount that opted out - only the false case is rendered
    asserts:
      # anchor the render so the notExists below cannot pass on an absent document
      - exists: { path: spec.template.spec.serviceAccountName }
      - notExists: { path: spec.template.spec.automountServiceAccountToken }

  - it: honours serviceAccount.automount when pointing at an external ServiceAccount
    # the knob used to be wired only into the chart-managed ServiceAccount, so with
    # create false it was silently dropped - assert the pod spec, not the SA object
    set:
      serviceAccount.create: false
      serviceAccount.automount: false
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: default }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  - it: honours serviceAccount.automount on a chart-managed ServiceAccount
    # the gate is on automount alone, so a chart-managed ServiceAccount must opt the
    # pod out too - the SA object's own field does not reach an already-created pod template
    set:
      serviceAccount.create: true
      serviceAccount.automount: false
    asserts:
      - exists: { path: spec.template.spec.serviceAccountName }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  # Optional pod-spec blocks. Static validation cannot see these: a pod spec
  # missing imagePullSecrets is schema-valid, so only a unit test catches a
  # `with` block that stopped rendering. Both directions are pinned - absent
  # when unset, and every entry present when set.
  - it: omits every optional pod-spec block when unset
    asserts:
      - notExists: { path: spec.template.spec.imagePullSecrets }
      - notExists: { path: spec.template.spec.nodeSelector }
      - notExists: { path: spec.template.spec.affinity }
      - notExists: { path: spec.template.spec.tolerations }
      - notExists: { path: spec.template.metadata.annotations }

  # updateStrategy is a `with` block with a NON-empty default, so losing it
  # does not omit a feature - it silently flips the workload to RollingUpdate.
  - it: keeps the Recreate update strategy by default
    asserts:
      - equal: { path: spec.strategy.type, value: Recreate }

  # Two entries per list on purpose: one entry cannot catch a range that only
  # ever emits its first item, and two map keys catch a `toYaml` swapped for a
  # single-key interpolation. Lengths are pinned too, so a spurious third entry
  # fails rather than passing on the two that were checked.
  - it: renders every entry of every optional pod-spec block when set
    set:
      imagePullSecrets:
        - name: first-registry
        - name: second-registry
      nodeSelector:
        kubernetes.io/arch: amd64
        topology.kubernetes.io/zone: us-east-1a
      tolerations:
        - key: first-taint
          operator: Exists
          effect: NoSchedule
        - key: second-taint
          operator: Exists
          effect: NoExecute
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                      - windows
      podLabels:
        first-label: one
        second-label: two
      podAnnotations:
        first-annotation: one
        second-annotation: two
    asserts:
      - lengthEqual: { path: "spec.template.spec.imagePullSecrets", count: 2 }
      - equal: { path: "spec.template.spec.imagePullSecrets[0].name", value: first-registry }
      - equal: { path: "spec.template.spec.imagePullSecrets[1].name", value: second-registry }
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64
      - equal:
          path: spec.template.spec.nodeSelector["topology.kubernetes.io/zone"]
          value: us-east-1a
      - lengthEqual: { path: "spec.template.spec.tolerations", count: 2 }
      - equal: { path: "spec.template.spec.tolerations[0].key", value: first-taint }
      - equal: { path: "spec.template.spec.tolerations[1].key", value: second-taint }
      - equal:
          path: "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[1]"
          value: windows
      - equal:
          path: spec.template.metadata.labels["first-label"]
          value: one
      - equal:
          path: spec.template.metadata.labels["second-label"]
          value: two
      - equal:
          path: spec.template.metadata.annotations["first-annotation"]
          value: one
      - equal:
          path: spec.template.metadata.annotations["second-annotation"]
          value: two

  # The counts pin both halves: a chart entry lost to a misplaced `with` fails
  # here, and so does a passthrough that renders nothing.
  - it: mounts only the config volume when the passthroughs are unset
    asserts:
      - lengthEqual: { path: spec.template.spec.volumes, count: 1 }
      - equal: { path: "spec.template.spec.volumes[0].name", value: config }
      - lengthEqual: { path: "spec.template.spec.containers[0].volumeMounts", count: 1 }
      - equal: { path: "spec.template.spec.containers[0].volumeMounts[0].mountPath", value: /config }

  - it: appends extra volumes and volumeMounts to the chart's own
    set:
      volumes:
        - name: first-extra
          emptyDir: {}
        - name: second-extra
          emptyDir: {}
      volumeMounts:
        - name: first-extra
          mountPath: /first
        - name: second-extra
          mountPath: /second
    asserts:
      - lengthEqual: { path: spec.template.spec.volumes, count: 3 }
      - equal: { path: "spec.template.spec.volumes[0].name", value: config }
      - contains:
          path: spec.template.spec.volumes
          content: { name: first-extra, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: second-extra, emptyDir: {} }
      - lengthEqual: { path: "spec.template.spec.containers[0].volumeMounts", count: 3 }
      - equal: { path: "spec.template.spec.containers[0].volumeMounts[0].mountPath", value: /config }
      - equal: { path: "spec.template.spec.containers[0].volumeMounts[1].mountPath", value: /first }
      - equal: { path: "spec.template.spec.containers[0].volumeMounts[2].mountPath", value: /second }
