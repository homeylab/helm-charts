suite: bookstack-file-exporter deployment
templates:
  # configmap.yaml is loaded (not asserted against - see configmap_test.yaml) because
  # deployment.yaml's checksum/config annotation includes it via $.Template.BasePath.
  - templates/deployment.yaml
  - templates/configmap.yaml
release:
  name: bookstack-file-exporter
tests:
  - it: does not render by default (config.run_interval == 0 uses CronJob instead)
    template: templates/deployment.yaml
    asserts:
      - hasDocuments: { count: 0 }
  - it: renders the Deployment when config.run_interval > 0
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Deployment }
  - it: renders the container image as registry/repository:tag
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/homeylab/bookstack-file-exporter:3.0.0
  - it: overrides the image tag when image.tag is set
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      image.tag: "3.0.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/homeylab/bookstack-file-exporter:3.0.1
  - it: keeps updateStrategy Recreate by default (RWO persistence PVC)
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      - equal: { path: spec.strategy.type, value: Recreate }
  - it: mounts the chart-rendered ConfigMap by default
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: bookstack-file-exporter
  - it: mounts config.existingConfigMap when set, instead of the chart-rendered ConfigMap
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      config.existingConfigMap: my-external-cm
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: my-external-cm
  - it: omits the configmap checksum annotation when config.existingConfigMap is set
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      config.existingConfigMap: my-external-cm
    asserts:
      - notExists: { path: "spec.template.metadata.annotations[\"checksum/config\"]" }
  - it: injects token env via secretKeyRef from the chart-managed Secret when auth.* is set
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      auth.tokenId: my-id
      auth.tokenSecret: my-token-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: BOOKSTACK_TOKEN_ID
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: bookstack-file-exporter
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: BOOKSTACK_TOKEN_ID
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: BOOKSTACK_TOKEN_SECRET
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: bookstack-file-exporter
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: BOOKSTACK_TOKEN_SECRET
  - it: points token secretKeyRef at existingSecret.name with custom keys when set
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      existingSecret.name: my-secret
      existingSecret.tokenIdKey: TID
      existingSecret.tokenSecretKey: TSEC
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-secret
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: TID
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: my-secret
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: TSEC
  - it: omits token env entirely when neither auth.* nor existingSecret.name is set
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      - notExists: { path: "spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef" }
  - it: renders extraEnvFrom (e.g. an ESO-synced Secret for object storage keys) at envFrom[0]
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      extraEnvFrom:
        - secretRef:
            name: eso-synced-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: eso-synced-secret
  - it: renders extraEnvFrom configMapRef standalone
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      extraEnvFrom:
        - configMapRef:
            name: extra-cm
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: extra-cm
  - it: omits liveness/readiness probes by default (config.health_port unset)
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      - notExists: { path: "spec.template.spec.containers[0].livenessProbe" }
      - notExists: { path: "spec.template.spec.containers[0].readinessProbe" }
  - it: adds /healthz liveness/readiness probes when config.health_port is set
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      config.health_port: "8080"
    asserts:
      - equal: { path: "spec.template.spec.containers[0].livenessProbe.httpGet.path", value: /healthz }
      - equal: { path: "spec.template.spec.containers[0].livenessProbe.httpGet.port", value: 8080 }
      - equal: { path: "spec.template.spec.containers[0].readinessProbe.httpGet.path", value: /healthz }
      - equal: { path: "spec.template.spec.containers[0].readinessProbe.httpGet.port", value: 8080 }
  - it: applies hardened securityContext defaults (UID/GID 33333)
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      - equal: { path: "spec.template.spec.securityContext.runAsNonRoot", value: true }
      - equal: { path: "spec.template.spec.securityContext.runAsUser", value: 33333 }
      - equal: { path: "spec.template.spec.securityContext.runAsGroup", value: 33333 }
      - equal: { path: "spec.template.spec.securityContext.fsGroup", value: 33333 }
      - equal: { path: "spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false }
      - contains:
          path: "spec.template.spec.containers[0].securityContext.capabilities.drop"
          content: ALL

  - it: leaves automountServiceAccountToken unset on the pod spec by default
    # the pod spec wins over the ServiceAccount, so writing true here would override
    # an external ServiceAccount that opted out - only the false case is rendered
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
    asserts:
      # anchor the render so the notExists below cannot pass on an absent document
      - exists: { path: spec.template.spec.serviceAccountName }
      - notExists: { path: spec.template.spec.automountServiceAccountToken }

  - it: honours serviceAccount.automount when pointing at an external ServiceAccount
    # the knob used to be wired only into the chart-managed ServiceAccount, so with
    # create false it was silently dropped - assert the pod spec, not the SA object
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      serviceAccount.create: false
      serviceAccount.automount: false
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: default }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  - it: does not force a token mount onto an external ServiceAccount
    # create false + automount true must stay silent so an external ServiceAccount
    # carrying automountServiceAccountToken false keeps its own opt-out
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      serviceAccount.create: false
      serviceAccount.automount: true
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: default }
      - notExists: { path: spec.template.spec.automountServiceAccountToken }

  - it: honours serviceAccount.automount on a chart-managed ServiceAccount
    # the gate is on automount alone, so a chart-managed ServiceAccount must opt the
    # pod out too - the SA object's own field does not reach an already-created pod template
    template: templates/deployment.yaml
    set:
      config.run_interval: 60
      serviceAccount.create: true
      serviceAccount.automount: false
    asserts:
      - exists: { path: spec.template.spec.serviceAccountName }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
