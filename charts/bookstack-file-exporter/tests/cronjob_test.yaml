suite: bookstack-file-exporter cronjob
templates:
  - templates/cronjob.yaml
release:
  name: bookstack-file-exporter
tests:
  - it: renders the CronJob by default (config.run_interval == 0)
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: CronJob }
  - it: does not render when config.run_interval > 0 (Deployment mode instead)
    set:
      config.run_interval: 60
    asserts:
      - hasDocuments: { count: 0 }
  - it: renders the container image as registry/repository:tag
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: docker.io/homeylab/bookstack-file-exporter:3.0.0
  - it: overrides the image tag when image.tag is set
    set:
      image.tag: "3.0.1"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: docker.io/homeylab/bookstack-file-exporter:3.0.1
  - it: does not render timeZone by default (cron.timeZone unset)
    asserts:
      - notExists: { path: spec.timeZone }
  - it: renders timeZone when cron.timeZone is set (regression guard - previously read the wrong values path and never rendered)
    set:
      cron.timeZone: "America/New_York"
    asserts:
      - equal: { path: spec.timeZone, value: "America/New_York" }
  - it: mounts the chart-rendered ConfigMap by default
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.name
          value: bookstack-file-exporter
  - it: mounts config.existingConfigMap when set, instead of the chart-rendered ConfigMap
    set:
      config.existingConfigMap: my-external-cm
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.name
          value: my-external-cm
  - it: injects token env via secretKeyRef from the chart-managed Secret when auth.* is set
    set:
      auth.tokenId: my-id
      auth.tokenSecret: my-token-secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].name
          value: BOOKSTACK_TOKEN_ID
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: bookstack-file-exporter
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: BOOKSTACK_TOKEN_SECRET
  - it: points token secretKeyRef at existingSecret.name when set (chart Secret not used)
    set:
      existingSecret.name: my-secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: my-secret
  - it: renders extraEnvFrom at envFrom[0]
    set:
      extraEnvFrom:
        - secretRef:
            name: eso-synced-secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: eso-synced-secret
  - it: applies hardened securityContext defaults (UID/GID 33333)
    asserts:
      - equal: { path: "spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot", value: true }
      - equal: { path: "spec.jobTemplate.spec.template.spec.securityContext.runAsUser", value: 33333 }
      - equal: { path: "spec.jobTemplate.spec.template.spec.securityContext.runAsGroup", value: 33333 }
      - equal: { path: "spec.jobTemplate.spec.template.spec.securityContext.fsGroup", value: 33333 }
      - equal: { path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false }
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.capabilities.drop"
          content: ALL
  - it: renders imagePullSecrets on the job pod template
    # the Deployment path always had this; the CronJob path did not, and CronJob is
    # the default mode (config.run_interval == 0)
    set:
      imagePullSecrets:
        - name: myreg
        - name: backupreg
    asserts:
      - equal: { path: "spec.jobTemplate.spec.template.spec.imagePullSecrets[0].name", value: myreg }
      - equal: { path: "spec.jobTemplate.spec.template.spec.imagePullSecrets[1].name", value: backupreg }
  - it: omits imagePullSecrets when none are set
    asserts:
      - notExists: { path: spec.jobTemplate.spec.template.spec.imagePullSecrets }

  - it: leaves automountServiceAccountToken unset on the CronJob pod spec by default
    # the pod spec wins over the ServiceAccount, so writing true here would override
    # an external ServiceAccount that opted out - only the false case is rendered
    asserts:
      # anchor the render so the notExists below cannot pass on an absent document
      - exists:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
      - notExists:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken

  - it: honours serviceAccount.automount on the CronJob pod spec with an external ServiceAccount
    set:
      serviceAccount.create: false
      serviceAccount.automount: false
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: default
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false

  - it: does not force a token mount onto an external ServiceAccount from the CronJob
    # create false + automount true must stay silent so an external ServiceAccount
    # carrying automountServiceAccountToken false keeps its own opt-out. This chart
    # defaults create true, so the default case above does not cover this pairing -
    # and the CronJob is the default mode (config.run_interval == 0)
    set:
      serviceAccount.create: false
      serviceAccount.automount: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: default
      - notExists:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken

  - it: honours serviceAccount.automount on the CronJob pod spec with a chart-managed ServiceAccount
    # the gate is on automount alone, so a chart-managed ServiceAccount must opt the
    # pod out too - the SA object's own field does not reach an already-created pod template
    set:
      serviceAccount.create: true
      serviceAccount.automount: false
    asserts:
      - exists:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
