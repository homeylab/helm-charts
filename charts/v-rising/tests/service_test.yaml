suite: v-rising server Service
templates:
  - templates/service.yaml
release:
  name: v-rising
tests:
  - it: renders the server Service with the chart fullname
    asserts:
      - equal: { path: metadata.name, value: v-rising }
  - it: exposes game and query ports as UDP
    asserts:
      - contains:
          path: spec.ports
          content: { name: gameport, port: 9876, targetPort: 9876, protocol: UDP }
      - contains:
          path: spec.ports
          content: { name: queryport, port: 9877, targetPort: 9877, protocol: UDP }
  - it: defaults to ClusterIP
    asserts:
      - equal: { path: spec.type, value: ClusterIP }
  - it: honors service.server.type override
    set:
      service.server.type: LoadBalancer
    asserts:
      - equal: { path: spec.type, value: LoadBalancer }
  # Was declared and documented but consumed by no template - setting it did
  # nothing. Both directions pinned so the wiring cannot come undone.
  - it: omits the annotations key when service.server.annotations is unset
    asserts:
      - notExists: { path: metadata.annotations }
  - it: renders every service.server.annotations entry
    # two keys: one cannot catch a toYaml swapped for a single-key interpolation
    set:
      service.server.annotations:
        metallb.universe.tf/address-pool: game-pool
        external-dns.alpha.kubernetes.io/hostname: vrising.example.com
    asserts:
      - equal:
          path: metadata.annotations["metallb.universe.tf/address-pool"]
          value: game-pool
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/hostname"]
          value: vrising.example.com
  - it: keeps server and rcon annotations independent
    set:
      service.rcon.annotations:
        rcon-only: "true"
    asserts:
      - notExists: { path: metadata.annotations }

  - it: renders every loadBalancerSourceRange
    # two ranges on purpose: the previous `indent` form aborted the render outright
    set:
      service.server.type: LoadBalancer
      service.server.loadBalancerSourceRanges:
        - 10.0.0.0/8
        - 192.168.0.0/16
    asserts:
      - equal: { path: "spec.loadBalancerSourceRanges[0]", value: 10.0.0.0/8 }
      - equal: { path: "spec.loadBalancerSourceRanges[1]", value: 192.168.0.0/16 }
