suite: v-rising deployment wiring
templates:
  - templates/deployment.yaml
release:
  name: v-rising
tests:
  - it: renders the container image as registry/repository:tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/trueosiris/vrising:3.0
  - it: uses an overridden image tag when set
    set:
      image.tag: "3.0.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/trueosiris/vrising:3.0.1
  - it: defaults the update strategy to Recreate to avoid RWO PVC multi-attach on upgrade
    asserts:
      - equal:
          path: spec.strategy
          value: { type: Recreate }
  - it: renders an overridden update strategy
    set:
      updateStrategy:
        type: RollingUpdate
    asserts:
      - equal:
          path: spec.strategy
          value: { type: RollingUpdate }
  - it: maps config to TZ/SERVERNAME/WORLDNAME/LOGDAYS env vars, keeping a zero logDays
    set:
      config:
        tz: America/Chicago
        serverName: myserver
        worldName: myworld
        logDays: 0
        branch: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: TZ, value: America/Chicago }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SERVERNAME, value: myserver }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: WORLDNAME, value: myworld }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: LOGDAYS, value: "0" }
  - it: omits the BRANCH env entirely when config.branch is empty
    set:
      config.branch: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: BRANCH }
  - it: renders the BRANCH env when config.branch is set
    set:
      config.branch: legacy-1.1.x-pc
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: BRANCH, value: legacy-1.1.x-pc }
  - it: renders extraEnv as additional env vars
    set:
      extraEnv:
        FOO: bar
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: FOO, value: bar }
  - it: renders game and query container ports as UDP
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content: { name: gameport, containerPort: 9876, protocol: UDP }
      - contains:
          path: spec.template.spec.containers[0].ports
          content: { name: queryport, containerPort: 9877, protocol: UDP }
  - it: omits the rcon container port when rcon is disabled (default)
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].ports
          content: { name: rconport }
  - it: renders the rcon container port as TCP when rcon is enabled
    set:
      service.rcon.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content: { name: rconport, containerPort: 25575, protocol: TCP }
  - it: leaves podSecurityContext and container securityContext empty by default (runs as root by design)
    asserts:
      - equal: { path: spec.template.spec.securityContext, value: {} }
      - equal: { path: "spec.template.spec.containers[0].securityContext", value: {} }
  - it: deployment volumes reference existingClaim names when set, for both steam server and world files
    set:
      persistence.steamServer.existingClaim: my-steam-claim
      persistence.world.existingClaim: my-world-claim
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-steam-claim
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: my-world-claim

  - it: leaves automountServiceAccountToken unset on the pod spec by default
    # the pod spec wins over the ServiceAccount, so writing true here would override
    # an external ServiceAccount that opted out - only the false case is rendered
    asserts:
      # anchor the render so the notExists below cannot pass on an absent document
      - exists: { path: spec.template.spec.serviceAccountName }
      - notExists: { path: spec.template.spec.automountServiceAccountToken }

  - it: honours serviceAccount.automount when pointing at an external ServiceAccount
    # the knob used to be wired only into the chart-managed ServiceAccount, so with
    # create false it was silently dropped - assert the pod spec, not the SA object
    set:
      serviceAccount.create: false
      serviceAccount.automount: false
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: default }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  - it: honours serviceAccount.automount on a chart-managed ServiceAccount
    # the gate is on automount alone, so a chart-managed ServiceAccount must opt the
    # pod out too - the SA object's own field does not reach an already-created pod template
    set:
      serviceAccount.create: true
      serviceAccount.automount: false
    asserts:
      - exists: { path: spec.template.spec.serviceAccountName }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  # Optional pod-spec blocks. Static validation cannot see these: a pod spec
  # missing imagePullSecrets is schema-valid, so only a unit test catches a
  # `with` block that stopped rendering. Both directions are pinned - absent
  # when unset, and every entry present when set.
  - it: omits every optional pod-spec block when unset
    asserts:
      - notExists: { path: spec.template.spec.imagePullSecrets }
      - notExists: { path: spec.template.spec.nodeSelector }
      - notExists: { path: spec.template.spec.affinity }
      - notExists: { path: spec.template.spec.tolerations }
      - notExists: { path: spec.template.metadata.annotations }

  # Two entries per list on purpose: one entry cannot catch a range that only
  # ever emits its first item, and two map keys catch a `toYaml` swapped for a
  # single-key interpolation. Lengths are pinned too, so a spurious third entry
  # fails rather than passing on the two that were checked.
  - it: renders every entry of every optional pod-spec block when set
    set:
      imagePullSecrets:
        - name: first-registry
        - name: second-registry
      nodeSelector:
        kubernetes.io/arch: amd64
        topology.kubernetes.io/zone: us-east-1a
      tolerations:
        - key: first-taint
          operator: Exists
          effect: NoSchedule
        - key: second-taint
          operator: Exists
          effect: NoExecute
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                      - windows
      podLabels:
        first-label: one
        second-label: two
      podAnnotations:
        first-annotation: one
        second-annotation: two
      volumes:
        - name: first-extra
          emptyDir: {}
        - name: second-extra
          emptyDir: {}
      volumeMounts:
        - name: first-extra
          mountPath: /first
        - name: second-extra
          mountPath: /second
    asserts:
      - lengthEqual: { path: "spec.template.spec.imagePullSecrets", count: 2 }
      - equal: { path: "spec.template.spec.imagePullSecrets[0].name", value: first-registry }
      - equal: { path: "spec.template.spec.imagePullSecrets[1].name", value: second-registry }
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64
      - equal:
          path: spec.template.spec.nodeSelector["topology.kubernetes.io/zone"]
          value: us-east-1a
      - lengthEqual: { path: "spec.template.spec.tolerations", count: 2 }
      - equal: { path: "spec.template.spec.tolerations[0].key", value: first-taint }
      - equal: { path: "spec.template.spec.tolerations[1].key", value: second-taint }
      - equal:
          path: "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[1]"
          value: windows
      - equal:
          path: spec.template.metadata.labels["first-label"]
          value: one
      - equal:
          path: spec.template.metadata.labels["second-label"]
          value: two
      - equal:
          path: spec.template.metadata.annotations["first-annotation"]
          value: one
      - equal:
          path: spec.template.metadata.annotations["second-annotation"]
          value: two
      - contains:
          path: spec.template.spec.volumes
          content: { name: first-extra, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: second-extra, emptyDir: {} }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: first-extra, mountPath: /first }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: second-extra, mountPath: /second }
