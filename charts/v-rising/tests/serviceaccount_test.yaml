suite: v-rising ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: v-rising
tests:
  - it: does not render when serviceAccount.create is false (default)
    asserts:
      - hasDocuments: { count: 0 }
  - it: renders when serviceAccount.create is true
    set:
      serviceAccount.create: true
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: v-rising }
  - it: uses serviceAccount.name override when set
    set:
      serviceAccount.create: true
      serviceAccount.name: custom-sa
    asserts:
      - equal: { path: metadata.name, value: custom-sa }
  - it: defaults automountServiceAccountToken to true on the ServiceAccount
    # pins the default: the pod spec writes nothing when automount is true, so the
    # SA object is the only place that value is observable on a default install
    set:
      serviceAccount.create: true
    asserts:
      - equal: { path: automountServiceAccountToken, value: true }
  - it: renders automountServiceAccountToken from values, not the chart default
    set:
      serviceAccount.create: true
      serviceAccount.automount: false
    asserts:
      - equal: { path: automountServiceAccountToken, value: false }
