suite: pihole-exporter ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: rel
tests:
  - it: does not render when serviceAccount.create is false (default)
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders when serviceAccount.create is true
    set:
      serviceAccount.create: true
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: apiVersion, value: v1 }
      - equal: { path: kind, value: ServiceAccount }
      - equal: { path: metadata.name, value: rel-pihole-exporter }
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pihole-exporter
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: rel

  - it: uses serviceAccount.name override when set
    set:
      serviceAccount.create: true
      serviceAccount.name: custom-sa
    asserts:
      - equal: { path: metadata.name, value: custom-sa }

  - it: defaults automountServiceAccountToken to true on the ServiceAccount
    set:
      serviceAccount.create: true
    asserts:
      - equal: { path: automountServiceAccountToken, value: true }

  - it: renders automountServiceAccountToken from values, not the chart default
    # the values default is true, so asserting true proves nothing — flip it
    set:
      serviceAccount.create: true
      serviceAccount.automount: false
    asserts:
      - equal: { path: automountServiceAccountToken, value: false }

  - it: omits annotations by default
    set:
      serviceAccount.create: true
    asserts:
      # anchor the render so the notExists below cannot pass on an absent document
      - exists: { path: metadata.name }
      - notExists: { path: metadata.annotations }

  - it: renders annotations when set
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/pihole-exporter
        team: homelab
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/pihole-exporter
      - equal:
          path: metadata.annotations["team"]
          value: homelab
