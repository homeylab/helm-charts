apiVersion: v2
name: pihole-exporter
description: A Helm Chart to deploy a Prometheus exporter for Pi-hole
type: application

home: https://github.com/eko/pihole-exporter
sources:
  - https://github.com/eko/pihole-exporter
  - https://github.com/homeylab/helm-charts
keywords:
  - pihole
  - pi-hole
  - prometheus
  - exporter
  - metrics
maintainers:
  - name: homeylab
    url: https://github.com/homeylab

# This is the chart version. SemVer: https://semver.org/
version: 2.1.0

# Application version (upstream image tag). Not SemVer-bound.
# renovate: datasource=docker depName=ekofr/pihole-exporter
appVersion: "v1.2.0"

# Minimum supported Kubernetes version. The -0 suffix matches managed distros'
# prerelease-style versions (e.g. v1.28.3-gke.x).
kubeVersion: ">=1.19.0-0"

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/homeylab/helm-charts/tree/main/charts/pihole-exporter
  artifacthub.io/changes: |
    - kind: security
      description: "serviceAccount.automount false now also sets automountServiceAccountToken on the pod spec, so it applies with an external ServiceAccount. Default rendering unchanged"
    - kind: fixed
      description: "the PrometheusRule is now gated on metrics.enabled as well as metrics.prometheusRule.enabled. NOTE: with metrics.enabled false it is REMOVED on upgrade"
    - kind: fixed
      description: "a PrometheusRule with an empty rules list is no longer rendered - it emitted `spec: null`, which the CRD rejects"
