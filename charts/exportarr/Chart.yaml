apiVersion: v2
name: exportarr
description: A Helm Chart to export Prometheus metrics for Arr applications.

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

home: https://github.com/onedr0p/exportarr
sources:
  - https://github.com/onedr0p/exportarr
  - https://github.com/homeylab/helm-charts
keywords:
  - exportarr
  - arr
  - prometheus
  - exporter
  - metrics
maintainers:
  - name: homeylab
    url: https://github.com/homeylab

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 4.2.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
# renovate: datasource=docker depName=ghcr.io/onedr0p/exportarr
appVersion: "v2.3.0"

# Minimum supported Kubernetes version. The -0 suffix matches managed distros'
# prerelease-style versions (e.g. v1.28.3-gke.x).
kubeVersion: ">=1.19.0-0"

# optional: include qbittorrent-exporter for prometheus
# ref: https://github.com/homeylab/helm-charts/tree/main/charts/qbittorrent-exporter
dependencies:
- name: qbittorrent-exporter
  version: "1.1.0"
  condition: qbittorrent-exporter.enabled
  repository: "oci://registry-1.docker.io/homeylabcharts"
- name: tdarr-exporter
  version: "2.1.0"
  condition: tdarr-exporter.enabled
  repository: "oci://registry-1.docker.io/homeylabcharts"

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/homeylab/helm-charts/tree/main/charts/exportarr
  artifacthub.io/images: |
    - name: exportarr
      image: ghcr.io/onedr0p/exportarr:v2.3.0
  artifacthub.io/changes: |
    - kind: security
      description: "exportarr.serviceAccount.automount is now applied to the pod spec, not only to the chart-managed ServiceAccount. With exportarr.serviceAccount.create false the setting was silently dropped, so a chart pointed at an external ServiceAccount mounted an API token regardless. Defaults are unchanged (automount true, which is also the Kubernetes default)"
    - kind: fixed
      description: "the PrometheusRule is now gated on exportarr.metrics.enabled as well as exportarr.metrics.prometheusRule.enabled. It previously rendered for a chart exporting no metrics at all. NOTE: if you run with exportarr.metrics.enabled false and exportarr.metrics.prometheusRule.enabled true, the PrometheusRule is REMOVED on upgrade - see the upgrade matrix in the README"
    - kind: changed
      description: "the exportarr.serviceAccount value keys now carry helm-docs `# --` markers, so they appear in the README value table; no behavioural change"
    - kind: added
      description: "unit test coverage pinning both the default and the mutated value of exportarr.serviceAccount.automount on the pod spec, and that the PrometheusRule stays unrendered with metrics disabled"
