apiVersion: v2
name: exportarr
description: A Helm Chart to export Prometheus metrics for Arr applications.

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

home: https://github.com/onedr0p/exportarr
sources:
  - https://github.com/onedr0p/exportarr
  - https://github.com/homeylab/helm-charts
keywords:
  - exportarr
  - arr
  - prometheus
  - exporter
  - metrics
maintainers:
  - name: homeylab
    url: https://github.com/homeylab

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 4.2.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
# renovate: datasource=docker depName=ghcr.io/onedr0p/exportarr
appVersion: "v2.3.0"

# Minimum supported Kubernetes version. The -0 suffix matches managed distros'
# prerelease-style versions (e.g. v1.28.3-gke.x).
kubeVersion: ">=1.19.0-0"

# optional: include qbittorrent-exporter for prometheus
# ref: https://github.com/homeylab/helm-charts/tree/main/charts/qbittorrent-exporter
dependencies:
- name: qbittorrent-exporter
  version: "1.1.0"
  condition: qbittorrent-exporter.enabled
  repository: "oci://registry-1.docker.io/homeylabcharts"
- name: tdarr-exporter
  version: "2.1.0"
  condition: tdarr-exporter.enabled
  repository: "oci://registry-1.docker.io/homeylabcharts"

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/homeylab/helm-charts/tree/main/charts/exportarr
  artifacthub.io/images: |
    - name: exportarr
      image: ghcr.io/onedr0p/exportarr:v2.3.0
  artifacthub.io/changes: |
    - kind: security
      description: "exportarr.serviceAccount.automount false is now honoured on the pod spec, not only on the chart-managed ServiceAccount. With exportarr.serviceAccount.create false the setting was silently dropped, so a chart pointed at an external ServiceAccount mounted an API token regardless. Nothing is written to the pod spec when automount is true, so an external ServiceAccount that opts out of token mounting keeps its own setting. Default rendering is unchanged; with exportarr.serviceAccount.create true and automount false the effective behaviour is also unchanged, but the pod template gains the field and rolls once"
    - kind: fixed
      description: "the PrometheusRule is now gated on the same effective metrics switch the Deployment and ServiceMonitor use - exportarr.metrics.enabled, overridable per instance via apps.<app>[].metrics.enabled - as well as exportarr.metrics.prometheusRule.enabled. It previously rendered even with the umbrella's Prometheus wiring switched off. NOTE: if no enabled instance has metrics on, the PrometheusRule is REMOVED on upgrade - see the upgrade matrix in the README"
    - kind: changed
      description: "values.schema.json now types the booleans the new render branches test with `not` and `if`: exportarr.serviceAccount.automount, and per instance apps.<app>[].metrics.enabled and apps.<app>[].metrics.serviceMonitor.enabled. A string - from `--set-string` or a quoted values entry - is truthy in Go templates, so `automount: \"false\"` would skip the pod-spec opt-out and `metrics.enabled: \"false\"` would leave metrics on. Both are now rejected at render time. The ServiceAccount object always interpolated automount directly and was never affected"
    - kind: changed
      description: "the exportarr.serviceAccount value keys now carry helm-docs `# --` markers, so they appear in the README value table; no behavioural change"
    - kind: changed
      description: "the per-instance metrics resolution that deployment.yaml, servicemonitor.yaml and prometheusrule.yaml each re-derived is now a single exportarr.metricsEnabled helper. Rendered output is byte-identical across a matrix of instance and override combinations; the templates change so that the three copies cannot drift apart again"
    - kind: added
      description: "unit test coverage pinning both the default and the mutated value of exportarr.serviceAccount.automount on the pod spec, and the PrometheusRule gate across metrics disabled, per-instance overrides in both directions, and mixed multi-instance installs"
    - kind: fixed
      description: "a PrometheusRule is no longer rendered when exportarr.metrics.prometheusRule.enabled is true but exportarr.metrics.prometheusRule.rules is empty. The spec block takes its only child from the rules list, so that combination emitted `spec: null` - rejected by the PrometheusRule CRD as \"got null, want object\", an object that could never be applied. Set rules to render one"
