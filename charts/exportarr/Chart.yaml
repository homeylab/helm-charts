apiVersion: v2
name: exportarr
description: A Helm Chart to export Prometheus metrics for Arr applications.
type: application

home: https://github.com/onedr0p/exportarr
sources:
  - https://github.com/onedr0p/exportarr
  - https://github.com/homeylab/helm-charts
keywords:
  - exportarr
  - arr
  - prometheus
  - exporter
  - metrics
maintainers:
  - name: homeylab
    url: https://github.com/homeylab

# This is the chart version. SemVer: https://semver.org/
version: 4.2.0

# Application version (upstream image tag). Not SemVer-bound.
# renovate: datasource=docker depName=ghcr.io/onedr0p/exportarr
appVersion: "v2.3.0"

# Minimum supported Kubernetes version. The -0 suffix matches managed distros'
# prerelease-style versions (e.g. v1.28.3-gke.x).
kubeVersion: ">=1.19.0-0"

# optional: include qbittorrent-exporter for prometheus
# ref: https://github.com/homeylab/helm-charts/tree/main/charts/qbittorrent-exporter
dependencies:
- name: qbittorrent-exporter
  version: "1.1.0"
  condition: qbittorrent-exporter.enabled
  repository: "oci://registry-1.docker.io/homeylabcharts"
- name: tdarr-exporter
  version: "2.1.0"
  condition: tdarr-exporter.enabled
  repository: "oci://registry-1.docker.io/homeylabcharts"

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/homeylab/helm-charts/tree/main/charts/exportarr
  artifacthub.io/images: |
    - name: exportarr
      image: ghcr.io/onedr0p/exportarr:v2.3.0
  artifacthub.io/changes: |
    - kind: security
      description: "exportarr.serviceAccount.automount false now also sets automountServiceAccountToken on the pod spec, so it applies with an external ServiceAccount. Default rendering unchanged. Does not reach the pinned qbittorrent-exporter / tdarr-exporter subcharts"
    - kind: fixed
      description: "the PrometheusRule is now gated on exportarr.metrics.enabled - global or per-instance - as well as prometheusRule.enabled. NOTE: with no enabled instance scraping, it is REMOVED on upgrade"
    - kind: fixed
      description: "a PrometheusRule with an empty rules list is no longer rendered - it emitted `spec: null`, which the CRD rejects"
    - kind: changed
      description: "values.schema.json now types serviceAccount.automount and per-instance metrics.enabled / metrics.serviceMonitor.enabled, so a string is rejected at render time instead of silently reading as true"
