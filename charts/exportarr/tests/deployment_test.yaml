suite: exportarr deployment wiring
templates:
  - templates/deployment.yaml
release:
  name: ex
tests:
  - it: renders the container image as registry/repository:tag and metrics containerPort
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/onedr0p/exportarr:v2.3.0
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9707

  - it: composes the image from the renamed registry/repository/tag keys
    set:
      exportarr.image.registry: quay.io
      exportarr.image.repository: acme/exportarr
      exportarr.image.tag: "v9.9.9"
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/acme/exportarr:v9.9.9

  - it: applies hardened pod and container securityContext defaults
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 65532 }
      - equal: { path: spec.template.spec.securityContext.runAsGroup, value: 65532 }
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 65532 }
      - equal: { path: spec.template.spec.securityContext.seccompProfile.type, value: RuntimeDefault }
      - equal: { path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: true }
      - equal: { path: "spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation", value: false }
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: one enabled instance sets args[0] to the arr type and URL env to the instance url
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - hasDocuments: { count: 1 }
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: radarr
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: URL, value: http://radarr:7878 }

  - it: two enabled instances across different arr types render two Deployment documents
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
      exportarr.apps.sonarr[0]:
        name: main
        enabled: true
        url: http://sonarr:8989
    asserts:
      - hasDocuments: { count: 2 }

  - it: inline apiKey renders API_KEY as a secretKeyRef, never a plaintext value
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
        apiKey: r-api-key-123
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: API_KEY
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: ex-exportarr-radarr-main
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: API_KEY
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: API_KEY, value: r-api-key-123 }

  - it: existingSecret set points API_KEY at the external secret name/key instead of the chart Secret
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
        apiKey: r-api-key-123
        existingSecret:
          name: external-radarr-secret
          secretKey: radarr_api_key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: API_KEY
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: external-radarr-secret
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: radarr_api_key

  - it: neither apiKey nor existingSecret set omits the API_KEY env entirely
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: API_KEY }

  - it: extraEnv on an instance renders as an upper-cased env var
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
        extraEnv:
          custom_flag: enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: CUSTOM_FLAG, value: enabled }

  - it: leaves automountServiceAccountToken unset on the pod spec by default
    # the pod spec wins over the ServiceAccount, so writing true here would override
    # an external ServiceAccount that opted out - only the false case is rendered
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      # anchor the render so the notExists below cannot pass on an absent document
      - exists: { path: spec.template.spec.serviceAccountName }
      - notExists: { path: spec.template.spec.automountServiceAccountToken }

  - it: honours serviceAccount.automount when pointing at an external ServiceAccount
    # the knob used to be wired only into the chart-managed ServiceAccount, so with
    # create false it was silently dropped - assert the pod spec, not the SA object
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
      exportarr.serviceAccount.create: false
      exportarr.serviceAccount.automount: false
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: default }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  - it: honours serviceAccount.automount on a chart-managed ServiceAccount
    # the gate is on automount alone, so a chart-managed ServiceAccount must opt the
    # pod out too - the SA object's own field does not reach an already-created pod template
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
      exportarr.serviceAccount.create: true
      exportarr.serviceAccount.automount: false
    asserts:
      - exists: { path: spec.template.spec.serviceAccountName }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }

  - it: renders the prometheus scrape annotations when metrics are on and no ServiceMonitor is used
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9707"

  - it: drops the prometheus scrape annotations when the instance overrides metrics off
    # metrics.enabled is resolved by the shared exportarr.metricsEnabled helper, which
    # this template, servicemonitor.yaml and prometheusrule.yaml all consume - pin it
    # here so breaking the helper cannot leave this suite green
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
        metrics:
          enabled: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
      - exists:
          path: spec.template.spec.serviceAccountName

  # Optional pod-spec blocks. Static validation cannot see these: a pod spec
  # missing imagePullSecrets is schema-valid, so only a unit test catches a
  # `with` block that stopped rendering. Both directions are pinned - absent
  # when unset, and every entry present when set.
  - it: omits every optional pod-spec block when unset
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - notExists: { path: spec.template.spec.imagePullSecrets }
      - notExists: { path: spec.template.spec.nodeSelector }
      - notExists: { path: spec.template.spec.affinity }
      - notExists: { path: spec.template.spec.tolerations }
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  # updateStrategy is a `with` block with a NON-empty default, so losing it
  # does not omit a feature - it silently flips the workload to RollingUpdate.
  - it: keeps the Recreate update strategy by default
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - equal: { path: spec.strategy.type, value: Recreate }

  # Two entries per list on purpose: one entry cannot catch a range that only
  # ever emits its first item, and two map keys catch a `toYaml` swapped for a
  # single-key interpolation. Lengths are pinned too, so a spurious third entry
  # fails rather than passing on the two that were checked.
  - it: renders every entry of every optional pod-spec block when set
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
        volumes:
          - name: per-app-extra
            emptyDir: {}
        volumeMounts:
          - name: per-app-extra
            mountPath: /per-app
      exportarr.imagePullSecrets:
        - name: first-registry
        - name: second-registry
      exportarr.nodeSelector:
        kubernetes.io/arch: amd64
        topology.kubernetes.io/zone: us-east-1a
      exportarr.tolerations:
        - key: first-taint
          operator: Exists
          effect: NoSchedule
        - key: second-taint
          operator: Exists
          effect: NoExecute
      exportarr.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                      - windows
      exportarr.podLabels:
        first-label: one
        second-label: two
      exportarr.podAnnotations:
        first-annotation: one
        second-annotation: two
      exportarr.volumes:
        - name: global-extra
          emptyDir: {}
      exportarr.volumeMounts:
        - name: global-extra
          mountPath: /global
    asserts:
      - lengthEqual: { path: "spec.template.spec.imagePullSecrets", count: 2 }
      - equal: { path: "spec.template.spec.imagePullSecrets[0].name", value: first-registry }
      - equal: { path: "spec.template.spec.imagePullSecrets[1].name", value: second-registry }
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/arch"]
          value: amd64
      - equal:
          path: spec.template.spec.nodeSelector["topology.kubernetes.io/zone"]
          value: us-east-1a
      - lengthEqual: { path: "spec.template.spec.tolerations", count: 2 }
      - equal: { path: "spec.template.spec.tolerations[0].key", value: first-taint }
      - equal: { path: "spec.template.spec.tolerations[1].key", value: second-taint }
      - equal:
          path: "spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[1]"
          value: windows
      - equal:
          path: spec.template.metadata.labels["first-label"]
          value: one
      - equal:
          path: spec.template.metadata.labels["second-label"]
          value: two
      - equal:
          path: spec.template.metadata.annotations["first-annotation"]
          value: one
      - equal:
          path: spec.template.metadata.annotations["second-annotation"]
          value: two
      - contains:
          path: spec.template.spec.volumes
          content: { name: global-extra, emptyDir: {} }
      - contains:
          path: spec.template.spec.volumes
          content: { name: per-app-extra, emptyDir: {} }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: global-extra, mountPath: /global }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: per-app-extra, mountPath: /per-app }

  # The component label is the only thing separating one instance's pods from
  # another's - every instance shares the same name/instance selector labels.
  # All three sites are pinned because dropping either of the selector-side ones
  # is silent: the Deployment still rolls, and its Service then selects the
  # wrong pods or none at all.
  - it: carries the per-instance component label on all three selector sites
    set:
      exportarr.apps.radarr[0]:
        name: main
        enabled: true
        url: http://radarr:7878
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: ex-exportarr-radarr-main
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: ex-exportarr-radarr-main
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: ex-exportarr-radarr-main
