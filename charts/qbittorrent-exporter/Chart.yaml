apiVersion: v2
name: qbittorrent-exporter
description: A Helm chart to export Prometheus metrics for qbittorrent.
type: application

home: https://github.com/martabal/qbittorrent-exporter
sources:
  - https://github.com/martabal/qbittorrent-exporter
  - https://github.com/homeylab/helm-charts
keywords:
  - qbittorrent
  - torrent
  - prometheus
  - exporter
  - metrics
maintainers:
  - name: homeylab
    url: https://github.com/homeylab

# This is the chart version. SemVer: https://semver.org/
version: 1.2.0

# Application version (upstream image tag). Not SemVer-bound.
# renovate: datasource=docker depName=ghcr.io/martabal/qbittorrent-exporter
appVersion: "v2.0.1"

# Minimum supported Kubernetes version. The -0 suffix matches managed distros'
# prerelease-style versions (e.g. v1.28.3-gke.x).
kubeVersion: ">=1.19.0-0"

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart Source
      url: https://github.com/homeylab/helm-charts/tree/main/charts/qbittorrent-exporter
  artifacthub.io/changes: |
    - kind: security
      description: "serviceAccount.automount is now applied to the pod spec, not only to the chart-managed ServiceAccount. With serviceAccount.create false the setting was silently dropped, so a chart pointed at an external ServiceAccount mounted an API token regardless. Defaults are unchanged (automount true, which is also the Kubernetes default)"
    - kind: fixed
      description: "the PrometheusRule is now gated on metrics.enabled as well as metrics.prometheusRule.enabled. It previously rendered for a chart exporting no metrics at all. NOTE: if you run with metrics.enabled false and metrics.prometheusRule.enabled true, the PrometheusRule is REMOVED on upgrade - see the upgrade matrix in the README"
    - kind: changed
      description: "the serviceAccount value keys now carry helm-docs `# --` markers, so they appear in the README value table; no behavioural change"
    - kind: added
      description: "unit test coverage pinning both the default and the mutated value of serviceAccount.automount on the pod spec, and that the PrometheusRule stays unrendered with metrics disabled"
