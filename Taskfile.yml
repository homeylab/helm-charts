version: '3'

# Usage: pass the target chart via APP, e.g. `task lint APP=bookstack`.
# List all tasks with `task` or `task --list`.

vars:
  CHART_DIR: charts
  LOCAL_VALUES_DIR: .local/values
  OCI_REGISTRY: oci://registry-1.docker.io/homeylabcharts

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  update-dep:
    desc: Update chart dependencies (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm dependency update {{.CHART_DIR}}/{{.APP}}

  pkg:
    desc: Package a chart (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm package {{.CHART_DIR}}/{{.APP}}

  pkg-with-dep:
    desc: Package a chart with dependencies bundled (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm package {{.CHART_DIR}}/{{.APP}} -u

  oci-push:
    desc: Push a packaged chart to the OCI registry (FILE=<chart>.tgz)
    requires:
      vars: [FILE]
    cmds:
      - helm push {{.FILE}} {{.OCI_REGISTRY}}

  lint:
    desc: Lint a chart (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm lint {{.CHART_DIR}}/{{.APP}}

  actionlint:
    desc: Lint the GitHub Actions workflows (repo-wide, no APP)
    # Mirrors .github/workflows/actionlint.yml. Install shellcheck too — actionlint
    # picks it up automatically and lints `run:` blocks; CI's pinned image bundles
    # it, so without it locally you get a weaker check than the gate.
    cmds:
      - actionlint -color

  test:
    desc: Run chart-testing install for a chart (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - ct install --config .github/ct/ct.yaml --charts {{.CHART_DIR}}/{{.APP}}

  template:
    desc: Render a chart's templates (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm template {{.APP}} {{.CHART_DIR}}/{{.APP}} --debug

  kubeconform:
    desc: Validate rendered manifests against k8s + CRD schemas (APP=<chart>)
    requires:
      vars: [APP]
    # Delegates to the same script CI runs (ct.yaml additional-commands) so the
    # two cannot drift. Override the target version with K8S_VERSION=.
    cmds:
      - K8S_VERSION={{.K8S_VERSION | default "1.30.0"}} scripts/ci/kubeconform.sh {{.CHART_DIR}}/{{.APP}}

  unittest:
    desc: Run helm unittest for a chart (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm unittest {{.CHART_DIR}}/{{.APP}}

  verify:
    desc: Local gate — lint + kubeconform + unittest (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - task: lint
        vars: { APP: '{{.APP}}' }
      - task: kubeconform
        vars: { APP: '{{.APP}}' }
      - task: unittest
        vars: { APP: '{{.APP}}' }

  docs:
    desc: Regenerate a chart's README from README.md.gotmpl via helm-docs (APP=<chart>)
    # Scoped to a single chart on purpose: charts without a README.md.gotmpl would
    # be overwritten with helm-docs' default template, clobbering hand-written READMEs.
    # Scoping alone only prevents *incidental* regeneration — a direct APP=<chart>
    # invocation still clobbers — so refuse outright when the chart has no template.
    requires:
      vars: [APP]
    cmds:
      - |
        if [ ! -f "{{.CHART_DIR}}/{{.APP}}/README.md.gotmpl" ]; then
          echo "{{.APP}} has no README.md.gotmpl - its README is hand-written, refusing to overwrite it" >&2
          exit 1
        fi
      - helm-docs --chart-search-root {{.CHART_DIR}}/{{.APP}}

  local-template:
    desc: Render a chart with local values (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm template {{.APP}} {{.CHART_DIR}}/{{.APP}} -f {{.LOCAL_VALUES_DIR}}/{{.APP}}.yaml --debug

  deploy-local:
    desc: Install or upgrade a chart with local values (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm upgrade --install -f {{.LOCAL_VALUES_DIR}}/{{.APP}}.yaml {{.APP}} {{.CHART_DIR}}/{{.APP}} -n local-{{.APP}} --create-namespace

  dryrun-local:
    desc: Dry-run install/upgrade a chart with local values (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm upgrade --install -f {{.LOCAL_VALUES_DIR}}/{{.APP}}.yaml {{.APP}} {{.CHART_DIR}}/{{.APP}} -n local-{{.APP}} --create-namespace --dry-run=client

  clean-local:
    desc: Delete a local release and its namespace (APP=<chart>)
    requires:
      vars: [APP]
    cmds:
      - helm delete {{.APP}} -n local-{{.APP}}
      - kubectl delete ns local-{{.APP}} --ignore-not-found
